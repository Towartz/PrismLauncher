name: Publish CI Artifacts to GitHub Release

on:
  workflow_dispatch:
    inputs:
      run-id:
        description: "GitHub Actions Run ID to publish"
        required: true
        default: "35446032795"
      tag-name:
        description: "Release tag name"
        required: true
        default: "v12.0.0-offline"
      title:
        description: "Release Title"
        required: true
        default: "Prism Launcher v12.0.0 (Offline Mode Enabled)"
      prerelease:
        description: "Mark as pre-release"
        type: boolean
        default: false

jobs:
  publish:
    name: Package and Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Install zip
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Download all artifacts from build run
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: raw_artifacts

      - name: Organize release assets
        run: |
          VERSION="${{ inputs.tag-name }}"
          mkdir -p release_assets

          cd raw_artifacts

          # Linux AppImages and zsync
          for f in PrismLauncher-Linux-*-Release-x86_64.AppImage/PrismLauncher-Linux-*-Release-x86_64.AppImage; do
            [ -f "$f" ] && cp "$f" ../release_assets/PrismLauncher-Linux-x86_64-${VERSION}.AppImage
          done
          for f in PrismLauncher-Linux-*-Release-x86_64.AppImage.zsync/PrismLauncher-Linux-*-Release-x86_64.AppImage.zsync; do
            [ -f "$f" ] && cp "$f" ../release_assets/PrismLauncher-Linux-x86_64-${VERSION}.AppImage.zsync
          done
          for f in PrismLauncher-Linux-*-Release-aarch64.AppImage/PrismLauncher-Linux-*-Release-aarch64.AppImage; do
            [ -f "$f" ] && cp "$f" ../release_assets/PrismLauncher-Linux-aarch64-${VERSION}.AppImage
          done
          for f in PrismLauncher-Linux-*-Release-aarch64.AppImage.zsync/PrismLauncher-Linux-*-Release-aarch64.AppImage.zsync; do
            [ -f "$f" ] && cp "$f" ../release_assets/PrismLauncher-Linux-aarch64-${VERSION}.AppImage.zsync
          done

          # Linux Portables
          for f in PrismLauncher-Linux-Qt6-Portable-*/PrismLauncher-portable.tar.gz; do
            [ -f "$f" ] && cp "$f" ../release_assets/PrismLauncher-Linux-Qt6-Portable-${VERSION}.tar.gz
          done
          for f in PrismLauncher-Linux-aarch64-Qt6-Portable-*/PrismLauncher-portable.tar.gz; do
            [ -f "$f" ] && cp "$f" ../release_assets/PrismLauncher-Linux-aarch64-Qt6-Portable-${VERSION}.tar.gz
          done

          # macOS
          for f in PrismLauncher-macOS-*.dmg/PrismLauncher.dmg; do
            [ -f "$f" ] && cp "$f" ../release_assets/PrismLauncher-macOS-${VERSION}.dmg
          done
          for f in PrismLauncher-macOS-*/PrismLauncher.zip; do
            [ -f "$f" ] && cp "$f" ../release_assets/PrismLauncher-macOS-${VERSION}.zip
          done

          # Windows MSVC x64
          for d in PrismLauncher-Windows-MSVC-Setup-*; do
            [ -d "$d" ] && cp "$d"/PrismLauncher*.exe ../release_assets/PrismLauncher-Windows-MSVC-Setup-${VERSION}.exe
          done
          for d in PrismLauncher-Windows-MSVC-Portable-*; do
            if [ -d "$d" ]; then
              (cd "$d" && zip -r -9 "../../release_assets/PrismLauncher-Windows-MSVC-Portable-${VERSION}.zip" .)
            fi
          done

          # Windows MinGW x64
          for d in PrismLauncher-Windows-MinGW-w64-Setup-*; do
            [ -d "$d" ] && cp "$d"/PrismLauncher*.exe ../release_assets/PrismLauncher-Windows-MinGW-w64-Setup-${VERSION}.exe
          done
          for d in PrismLauncher-Windows-MinGW-w64-Portable-*; do
            if [ -d "$d" ]; then
              (cd "$d" && zip -r -9 "../../release_assets/PrismLauncher-Windows-MinGW-w64-Portable-${VERSION}.zip" .)
            fi
          done

          # Windows MSVC ARM64
          for d in PrismLauncher-Windows-MSVC-arm64-Setup-*; do
            [ -d "$d" ] && cp "$d"/PrismLauncher*.exe ../release_assets/PrismLauncher-Windows-MSVC-arm64-Setup-${VERSION}.exe
          done
          for d in PrismLauncher-Windows-MSVC-arm64-Portable-*; do
            if [ -d "$d" ]; then
              (cd "$d" && zip -r -9 "../../release_assets/PrismLauncher-Windows-MSVC-arm64-Portable-${VERSION}.zip" .)
            fi
          done

          cd ..
          ls -lah release_assets/

      - name: Checkout repository for changelog
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Changelog from Commits
        id: changelog
        run: |
          python3 .github/scripts/generate_changelog.py \
            --curr-tag "${{ inputs.tag-name }}" \
            --repo "${{ github.repository }}" \
            --title "${{ inputs.title }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Create GitHub Release with assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag-name }}
          target_commitish: develop
          name: ${{ inputs.title }}
          prerelease: ${{ inputs.prerelease }}
          files: release_assets/*
          token: ${{ secrets.GITHUB_TOKEN }}
          body: ${{ steps.changelog.outputs.body }}

      - name: Checkout develop branch for releases.json cache
        uses: actions/checkout@v4
        with:
          ref: develop
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update releases.json cache
        run: |
          gh api repos/${{ github.repository }}/releases > releases.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add releases.json
          git diff-index --quiet HEAD || (git commit -m "chore: update releases.json cache [skip ci]" && git push origin develop)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

