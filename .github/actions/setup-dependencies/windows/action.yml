name: Setup Windows Dependencies
description: Install and setup dependencies for building Prism Launcher

inputs:
  build-type:
    description: Type for the build
    required: true
    default: Debug
  msystem:
    description: MSYS2 subsystem to use
    required: false
  vcvars-arch:
    description: Visual Studio architecture to use
    required: true
    default: amd64

runs:
  using: composite

  steps:
    # NOTE: Installed on MinGW as well for SignTool
    - name: Enter VS Developer shell
      if: ${{ runner.os == 'Windows' }}
      shell: pwsh
      run: |
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
        if (-not $vsPath) {
          $vsPath = & $vswhere -latest -products * -property installationPath
        }
        $vcvars = Join-Path $vsPath "VC\Auxiliary\Build\vcvarsall.bat"
        Write-Host "Using Visual Studio at: $vsPath ($vcvars) with arch: ${{ inputs.vcvars-arch }}"
        $origPaths = @($env:PATH -split ";" | Where-Object { $_ })
        $cmd = "`"$vcvars`" ${{ inputs.vcvars-arch }} > nul && set"
        cmd.exe /c $cmd | ForEach-Object {
          if ($_ -match "^([^=]+)=(.*)$") {
            $name = $matches[1]
            $val = $matches[2]
            if ($name -ieq "PATH") {
              $newPaths = @($val -split ";" | Where-Object { $_ -and ($origPaths -notcontains $_) })
              [array]::Reverse($newPaths)
              foreach ($p in $newPaths) {
                $p | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
              }
            } elseif ($name -notmatch "^(PROMPT|_|PATHEXT|COMSPEC|SYSTEMROOT|WINDIR)$") {
              "$name=$val" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            }
          }
        }

    - name: Setup Java (MSVC)
      uses: actions/setup-java@v6
      with:
        # NOTE(@getchoo): We should probably stay on Zulu.
        # Temurin doesn't have Java 17 builds for WoA
        distribution: zulu
        java-version: 17

    - name: Setup vcpkg cache (MSVC)
      if: ${{ inputs.msystem == '' }}
      shell: pwsh
      env:
        USERNAME: ${{ github.repository_owner }}
        GITHUB_TOKEN: ${{ github.token }}
        FEED_URL: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
      run: |
        .$(vcpkg fetch nuget) `
          sources add `
          -Source "$env:FEED_URL" `
          -StorePasswordInClearText `
          -Name GitHubPackages `
          -UserName "$env:USERNAME" `
          -Password "$env:GITHUB_TOKEN"
        .$(vcpkg fetch nuget) `
          setapikey "$env:GITHUB_TOKEN" `
          -Source "$env:FEED_URL"
        "VCPKG_BINARY_SOURCES=clear;nuget,$env:FEED_URL,readwrite" | Out-File -Append $env:GITHUB_ENV

    - name: Setup vcpkg environment (MSVC)
      if: ${{ inputs.msystem == '' }}
      shell: bash
      run: |
        echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"

    - name: Setup MSYS2 (MinGW)
      if: ${{ inputs.msystem != '' }}
      uses: msys2/setup-msys2@v2
      with:
        msystem: ${{ inputs.msystem }}
        update: true
        install: >-
          git
        pacboy: >-
          toolchain:p
          ccache:p
          cmake:p
          ninja:p
          python:p

    - name: List pacman packages (MinGW)
      if: ${{ inputs.msystem != '' }}
      shell: msys2 {0}
      run: |
        pacman -Qe

    - name: Retrieve ccache cache (MinGW)
      if: ${{ inputs.msystem != '' }}
      uses: actions/cache@v6.1.0
      with:
        path: '${{ github.workspace }}\.ccache'
        key: ${{ runner.os }}-mingw-w64-ccache-${{ github.run_id }}
        restore-keys: |
          ${{ runner.os }}-mingw-w64-ccache

    - name: Setup ccache (MinGW)
      if: ${{ inputs.msystem != '' }}
      shell: msys2 {0}
      run: |
        ccache --set-config=cache_dir='${{ github.workspace }}\.ccache'
        ccache --set-config=max_size='1G'
        ccache --set-config=compression=true
        ccache --set-config=sloppiness='pch_defines,time_macros,include_file_mtime,include_file_ctime'
        ccache -p  # Show config
